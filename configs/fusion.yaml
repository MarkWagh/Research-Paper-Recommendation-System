# Score fusion of the strongest text and graph signals (weights tuned on validation NDCG@20).
# Components use the hyper-parameters chosen on validation in the baseline runs.
tune_queries: 1500

_components: &components
  text: {name: embedding, params: {feature: minilm, query_mode: combo, alpha: 0.6}}
  graph: {name: ppr, params: {alpha: 0.25, num_iter: 20, direction: both}}
  pop: {name: popularity}

models:
  - name: fusion
    label: fusion
    params: {components: *components, weights: {text: 1.0, graph: 1.0, pop: 0.0}}
    variants:
      text_graph:
        params: {w_pop: 0.0}
        tune: {norm: [zscore, logrank], w_graph: [0.5, 1.0, 2.0, 3.0, 4.0, 6.0, 8.0, 12.0, 16.0]}
      text_graph_pop:
        tune: {norm: [logrank], w_graph: [2.0, 4.0, 6.0, 8.0, 12.0], w_pop: [0.1, 0.25, 0.5, 1.0]}
